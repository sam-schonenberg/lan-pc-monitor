services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - relay-data:/data
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    networks: [relay]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_DOMAIN: notify.example.com
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [relay]

networks:
  relay:

volumes:
  relay-data:
  caddy-data:
  caddy-config:
